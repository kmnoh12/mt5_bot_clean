  retain_ratio: 0.8
  min_activation_profit_usd: 5.0
  breach_close: true
  sync_sl_to_lock_line: true
  close_retry_cooldown_seconds: 30
  block_strategy_for_protected_symbols: false
execution_churn_guard:
