    trail_tp_start_R: 1.2         # TP 트레일링 시작 조건 (move_rr >= 이 값일 때)
    trail_tp_step_R: 0.6          # 가격이 1R 추가 이동할 때마다 TP를 step_R * risk_per_unit 만큼 올림
    trail_tp_ratchet: true        # true면 TP는 절대 내려가지 않음 (래칫 모드)
    atr_period: 14
    pivot_lookback_sec: 1800
    swing_window: 45
    sweep_buffer_atr: 0.008
    reclaim_buffer_atr: 0.012
    reclaim_window_sec: 900
    reclaim_extension_sec: 180
    displacement_mult: 0.9
    displacement_lookback: 20
    sl_atr_mult: 0.9
    stop_buffer_atr: 0.16
    tp_R1: 2.0
    tp_R2: 4.0
    be_at_R: 1.0
    max_hold_bars: 80
    zombie_bar_limit: 25
    min_hold_bars: 3
    min_cooldown_bars: 8
    fvg_enabled: false
    retest_enabled: false
    symbol_params:
      BTCUSD:
        displacement_mult: 0.4
        trend_filter_enabled: false
        sweep_buffer_atr: 0.005
        reclaim_extension_sec: 600
        reclaim_window_sec: 2400
        zombie_bar_limit: 60
        min_cooldown_bars: 3
        min_atr: 0.0005
      ETHUSD:
        displacement_mult: 0.4
        sweep_buffer_atr: 0.005
        reclaim_window_sec: 2400
        reclaim_extension_sec: 600
        retest_window_bars: 8
      SOLUSD:
        displacement_mult: 0.45
        trend_filter_enabled: true
        sweep_buffer_atr: 0.005
        reclaim_buffer_atr: 0.007
        reclaim_window_sec: 2400
        reclaim_extension_sec: 600
        sl_atr_mult: 0.45
        stop_buffer_atr: 0.08
        max_hold_bars: 80
        zombie_bar_limit: 50
        tp_R2: 3.0
        min_cooldown_bars: 6
        retest_window_bars: 8


  trend_regime_sm:
