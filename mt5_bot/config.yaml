mt5:
  init_timeout_ms: 60000
  login: 410663362
  server_time_offset_hours: 2.0
  server: "XMGlobal-MT5 16"
  password: "" # Saved in MT5 terminal
  max_spread_points: 1200
  attach_only: true
  allow_programmatic_login: false
  allow_terminal_launch: true
  close_terminal_on_exit: true
  account_guard_enabled: true
  require_trade_enabled: true
  reconnect_init_timeout_ms: 15000

general:
  mode: "live"
  dry_run: true
  poll_seconds: 1.0
  heartbeat_seconds: 60
  reconnect:
    max_attempts: 6
    attempts_per_cycle: 1
    base_delay_seconds: 5.0
    max_delay_seconds: 30.0
    cooldown_seconds: 10.0
    jitter_seconds: 0.5
    max_ipc_failures_before_halt: 8
    force_shutdown_on_reconnect: false

execution:
  close_positions_on_exit: true
  default_volume: 0.01
  max_positions_per_symbol: 2
  allow_opposite_position: false
  bar_close_only: false
  max_spread: 1200
  max_expected_loss_usd_by_symbol:
    SOLUSD: 1.2

risk_guard:
  risk_per_trade_pct: 0.005
  max_risk_per_trade_pct: 0.01
  daily_loss_limit_pct: 0.03
  session_loss_limit_pct: 0.05
  max_consecutive_losses: 6
  auto_resume_daily_drawdown_on_new_day: true
  auto_resume_after_halt_minutes: 0
  manual_resume_resets_daily_baseline: true
  dynamic_risk_cap_enabled: true
  dynamic_risk_min_pct: 0.005
  dynamic_risk_max_pct: 0.03
  dynamic_risk_lookback_hours: 24
  dynamic_risk_min_samples: 8
  dynamic_risk_winrate_floor: 0.35
  dynamic_risk_winrate_ceiling: 0.65
  dynamic_lot_enabled: true
  dynamic_lot_fail_mode: "fallback"
  dynamic_lot_default_lot: 0.01
  dynamic_lot_min_volume_policy: "block"
  kelly_fraction: 0.5
  dd_hard_stop_pct: 0.12

trailing_profit_guard:
  enabled: true
  retain_ratio: 0.5
  min_activation_profit_usd: 3.0
  stage_a_activation_usd: 3.0
  stage_b_activation_usd: 15.0
  stage_b_retain_ratio: 0.10
  stage_c_activation_usd: 35.0
  stage_c_retain_ratio: 0.35
  break_even_enabled: true
  break_even_activation_profit_usd: 3.0
  break_even_lock_profit_usd: 0.2
  break_even_sync_sl: true
  min_hold_seconds_for_exit: 300
  min_drawdown_usd_for_exit: 2.5
  min_breach_count_for_exit: 2

manual_position_guard:
  enabled: false
  symbols: []
  manual_magic_values: [0]
  retain_ratio: 0.8
  min_activation_profit_usd: 5.0
  breach_close: true
  sync_sl_to_lock_line: true
  close_retry_cooldown_seconds: 30
  block_strategy_for_protected_symbols: false

execution_churn_guard:
  enabled: true
  reentry_cooldown_seconds: 45
  flip_reentry_cooldown_seconds: 15
  protection_retry_interval_seconds: 2.0
  protection_retry_max_attempts: 8
  protection_failure_lock_seconds: 120
  loss_reentry_lock_seconds: 90
  max_entries_per_symbol_per_hour: 2
  max_entries_per_symbol_per_day: 4
  max_entries_per_symbol_per_day_eth: 1
  max_entries_global_per_day: 6
  daily_reset_timezone: "Asia/Seoul"
  per_symbol_daily_limits:
    BTCUSD: 2
    ETHUSD: 0
    SOLUSD: 0
    GOLD: 0
    Nvidia_turbo: 0
    AMD_turbo: 0
  min_hold_bars_floor: 2
  min_hold_bars_floor_by_symbol:
    BTCUSD: 3
    ETHUSD: 3
    SOLUSD: 5
    GOLD: 2
    Nvidia_turbo: 2
    AMD_turbo: 2
  tiny_pnl_threshold_usd: 1.5
  quick_exit_window_seconds: 180
  tiny_pnl_max_count_per_hour: 4
  tiny_pnl_cooldown_seconds: 1200

entry_quality_guard:
  enabled: false
  trend_only_symbols: []
  min_score: 0.1
  min_score_risk_off: 0.1
  min_score_risk_on: 0.1
  lookback_closed_trades: 200
  min_winner_pnl_usd: 5.0
  max_churn_abs_pnl_usd: 2.0
  max_churn_hold_seconds: 300

cost_edge_guard:
  enabled: false
  min_edge_to_cost_ratio_default: 1.1
  min_edge_to_cost_ratio_by_symbol:
    GOLD: 1.0
  spread_sample_bars: 120
  use_recent_deal_cost_stats: true

exit_quality_guard:
  enabled: true
  tiny_profit_block_usd: 2.0
  min_hold_seconds_for_soft_exit: 300
  m5_reverse_confirm_bars: 2

broker_request_guard:
  enabled: true
  comment_ascii_only: true
  comment_max_len: 24
  retry_without_comment_on_invalid_comment: true

mtf_confirm:
  enabled: false
  symbols: ["BTCUSD"]
  confirm_timeframe: "TIMEFRAME_M5"
