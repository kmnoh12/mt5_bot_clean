mt5:
  init_timeout_ms: 60000
  login: 0
  server_time_offset_hours: 2.0
  server: REDACTED
  password: ''
  max_spread_points: 1200
  attach_only: true
  allow_programmatic_login: false
  allow_terminal_launch: true
  close_terminal_on_exit: true
  account_guard_enabled: true
  require_trade_enabled: false
  reconnect_init_timeout_ms: 15000
  require_trade_enabled_note: false only for dry-run/paper startup; live order gate
    remains closed
general:
  mode: live
  dry_run: true
  poll_seconds: 1.0
  heartbeat_seconds: 60
  reconnect:
    max_attempts: 6
    attempts_per_cycle: 1
    base_delay_seconds: 5.0
    max_delay_seconds: 30.0
    cooldown_seconds: 10.0
    jitter_seconds: 0.5
    max_ipc_failures_before_halt: 8
    force_shutdown_on_reconnect: false
execution:
  dry_run: true
  live_trading_enabled: false
  close_positions_on_exit: false
  default_volume: 0.01
  max_positions_per_symbol: 1
  allow_opposite_position: false
  bar_close_only: true
  max_spread: 1200
  max_expected_loss_usd_by_symbol:
    BTCUSD: 0.9
    ETHUSD: 0.75
    SOLUSD: 0.75

# Small-account BTC LSR entry-gate baseline. Keeps loss/daily/position caps intact
# while avoiding default 3R/$3-$5 initial-exit gates that contradict the active
# LSR TP profile (~2.2R) and block otherwise bounded 0.7~0.9 USD risk entries.
entry_quality:
  min_reward_to_net_risk_ratio: 2.0
  min_signal_score: 70
  forbid_late_entry: true
  require_deterministic_signal: true
  allow_llm_discretionary_entry: false
  allow_llm_discretionary_veto: false
initial_exit:
  take_profit:
    min_profit_usd: 1.5
    preferred_profit_usd: 2.0
    allow_tp_extension: true
risk_guard:
  risk_per_trade_pct: 0.002
  max_risk_per_trade_pct: 0.003
  daily_loss_limit_pct: 0.015
  session_loss_limit_pct: 0.02
  max_consecutive_losses: 4
  auto_resume_daily_drawdown_on_new_day: true
  auto_resume_after_halt_minutes: 0
  manual_resume_resets_daily_baseline: true
  dynamic_risk_cap_enabled: true
  dynamic_risk_min_pct: 0.001
  dynamic_risk_max_pct: 0.003
  dynamic_risk_lookback_hours: 24
  dynamic_risk_min_samples: 8
  dynamic_risk_winrate_floor: 0.35
  dynamic_risk_winrate_ceiling: 0.65
  dynamic_lot_enabled: true
  dynamic_lot_fail_mode: block
  dynamic_lot_default_lot: 0.01
  dynamic_lot_min_volume_policy: block
  kelly_fraction: 0.25
  dd_hard_stop_pct: 0.08
trailing_profit_guard:
  enabled: true
  retain_ratio: 0.5
  min_activation_profit_usd: 3.0
  stage_a_activation_usd: 3.0
  stage_b_activation_usd: 15.0
  stage_b_retain_ratio: 0.1
  stage_c_activation_usd: 35.0
  stage_c_retain_ratio: 0.35
  break_even_enabled: true
  break_even_activation_profit_usd: 3.0
  break_even_lock_profit_usd: 0.2
  break_even_sync_sl: true
  min_hold_seconds_for_exit: 300
  min_drawdown_usd_for_exit: 2.5
  min_breach_count_for_exit: 2
manual_position_guard:
  enabled: false
  symbols: []
  manual_magic_values:
  - 0
  retain_ratio: 0.8
  min_activation_profit_usd: 5.0
  breach_close: true
  sync_sl_to_lock_line: true
  close_retry_cooldown_seconds: 30
  block_strategy_for_protected_symbols: false
execution_churn_guard:
  enabled: true
  reentry_cooldown_seconds: 300
  flip_reentry_cooldown_seconds: 180
  protection_retry_interval_seconds: 2.0
  protection_retry_max_attempts: 8
  protection_failure_lock_seconds: 120
  loss_reentry_lock_seconds: 600
  max_entries_per_symbol_per_hour: 1
  max_entries_per_symbol_per_day: 2
  max_entries_per_symbol_per_day_eth: 0
  max_entries_global_per_day: 1
  daily_reset_timezone: Asia/Seoul
  per_symbol_daily_limits:
    BTCUSD: 1
    ETHUSD: 0
    SOLUSD: 0
    GOLD: 0
    Nvidia_turbo: 0
    AMD_turbo: 0
  min_hold_bars_floor: 2
  min_hold_bars_floor_by_symbol:
    BTCUSD: 3
    ETHUSD: 3
    SOLUSD: 5
    GOLD: 2
    Nvidia_turbo: 2
    AMD_turbo: 2
  tiny_pnl_threshold_usd: 1.5
  quick_exit_window_seconds: 180
  tiny_pnl_max_count_per_hour: 2
  tiny_pnl_cooldown_seconds: 3600
entry_quality_guard:
  enabled: true
  trend_only_symbols:
  - BTCUSD
  # LSR live decisions currently provide m5_align but not trend/adx/ema indicator
  # features, so 0.62 made BTCUSD entries effectively impossible (observed
  # score 0.20 / threshold 0.62). Keep M5 confirm/spread/daily caps intact,
  # but let M5-confirmed LSR entries pass quality guard.
  min_score: 0.2
  min_score_risk_off: 0.25
  min_score_risk_on: 0.2
  lookback_closed_trades: 200
  min_winner_pnl_usd: 5.0
  max_churn_abs_pnl_usd: 2.0
  max_churn_hold_seconds: 300
cost_edge_guard:
  enabled: true
  min_edge_to_cost_ratio_default: 2.0
  min_edge_to_cost_ratio_by_symbol:
    # After BTC entry-quality alignment, BTC LSR entries were repeatedly blocked
    # by tiny edge-margin misses (1.949<2.0, then 1.873<1.9). Lower BTC only
    # to 1.75 while keeping default/ETH/SOL/GOLD unchanged.
    BTCUSD: 1.75
    ETHUSD: 3.0
    SOLUSD: 3.0
    GOLD: 2.5
  spread_sample_bars: 120
  use_recent_deal_cost_stats: true
exit_quality_guard:
  enabled: true
  tiny_profit_block_usd: 2.0
  min_hold_seconds_for_soft_exit: 300
  m5_reverse_confirm_bars: 2
broker_request_guard:
  enabled: true
  comment_ascii_only: true
  comment_max_len: 24
  retry_without_comment_on_invalid_comment: true
mtf_confirm:
  enabled: false
  symbols:
  - BTCUSD
  confirm_timeframe: TIMEFRAME_M5
  fast_ema: 20
  slow_ema: 50
trade_journal:
  enabled: true
  output_dir: ./reports/paper_forward_btc_trial61
  tiny_pnl_threshold_usd: 2.0
  quick_exit_window_seconds: 300
  big_loss_threshold_usd: -10.0
