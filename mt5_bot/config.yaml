universe:
  - symbol: "BTCUSD"
    strategy: "liquidity_sweep_reversal"
    timeframe: "TIMEFRAME_M1"
    volume: 0.01

strategies:
  deep_wave_sm:
    enabled: false
    ema_period: 50
    rsi_period: 14
    oversold: 30.0
    overbought: 70.0
    atr_period: 14
    sl_mult: 2.0
    tp_mult: 4.0

  liquidity_sweep_reversal:
    enabled: true
    trail_atr_mult: 0.5
    trail_enabled: true
    trail_start_R: 1.4
    # ── TP Trailing (추세 추적 익절) ──
