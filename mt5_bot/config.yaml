      max: 3.2
    trend_tp_r_multiple:
      min: 0.8
      max: 5.0
    trailing_atr_mult:
      min: 0.4
      max: 3.0
    trailing_start_rr:
      min: 0.45
      max: 3.0
    regime_flip_exit_threshold:
      min: 0.05
      max: 0.55

